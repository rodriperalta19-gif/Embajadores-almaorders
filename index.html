lack uppercase tracking-widest">Panel del Embajador</p> <h1 class="text-3xl font-black mt-2">Hola, <span x-text="nombre || 'Embajador'"></span>! 👋</h1> <div class="grid grid-cols-2 gap-4 mt-8"> <div class="bg-card p-5 rounded-3xl"><p class="text-[9px] text-zinc-500 uppercase font-black mb-1">Tus Ventas</p><p class="text-2xl font-black text-white">$12.500</p></div> <div class="bg-card p-5 rounded-3xl"><p class="text-[9px] text-[#bef264] uppercase font-black mb-1">Comisión</p><p class="text-2xl font-black text-[#bef264]">$5.000</p></div> </div> </header> <section class="bg-card p-6 rounded-[32px] border-2 border-emerald-500/20 mb-6"> <h3 class="font-black text-xs uppercase mb-4 flex items-center gap-2 text-zinc-400"><i class="fas fa-chart-line text-[#bef264]"></i> Bono Trimestral</h3> <div class="w-full bg-zinc-900 h-4 rounded-full p-1 mb-2"> <div class="h-full bg-emerald-500 rounded-full emerald-glow" style="width: 82%"></div> </div> <p class="text-right text-[10px] font-black text-emerald-500">82 / 100 VENTAS</p> </section> <button @click="modalPago = true" class="w-full bg-white text-black font-black py-5 rounded-2xl shadow-xl shadow-white/5 uppercase text-xs tracking-widest active:scale-95 transition-all">Solicitar Cierre Mensual</button> </div> <!-- RANGOS --> <div x-show="tab === 'rangos'" class="p-8 animate-fade-in"> <h2 class="text-2xl font-black mb-8 lime-accent uppercase italic">Tu Carrera</h2> <div class="space-y-8 relative before:content-[''] before:absolute before:left-3 before:top-0 before:h-full before:w-0.5 before:bg-zinc-800"> <div class="relative pl-10"> <div class="absolute left-1.5 top-0 w-3.5 h-3.5 bg-emerald-500 rounded-full emerald-glow shadow-[0_0_15px_#10b981]"></div> <h4 class="font-black text-emerald-400">BRONCE</h4> <p class="text-xs text-zinc-500 mt-1 italic">Logrado el 12 de Marzo</p> </div> <div class="relative pl-10"> <div class="absolute left-1.5 top-0 w-3.5 h-3.5 bg-white rounded-full shadow-[0_0_15px_#fff]"></div> <div class="bg-zinc-900 p-5 rounded-2xl border border-white/20"> <h4 class="font-black text-white">PLATA</h4> <p class="text-xs text-zinc-400 mt-1">Premio: Tablet de Trabajo</p> <button @click="alert('¡Solicitud enviada! El administrador validará tu premio.')" class="mt-4 w-full bg-[#bef264] text-black font-black py-2 rounded-xl text-[10px] uppercase">Reclamar Ahora</button> </div> </div> </div> </div> <!-- EQUIPO --> <div x-show="tab === 'equipo'" class="p-8 animate-fade-in"> <h2 class="text-2xl font-black mb-2 uppercase italic">Mi Red</h2> <p class="text-zinc-500 text-xs mb-10 font-medium">8 Embajadores referidos por ti.</p> <div class="space-y-4"> <div class="bg-card p-4 rounded-2xl flex items-center justify-between border-l-4 border-emerald-500"> <div class="flex items-center gap-4"> <div class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center font-bold">JP</div> <div><p class="text-sm font-black">Juan Pérez</p><p class="text-[10px] text-emerald-500 font-bold tracking-widest uppercase">Activo</p></div> </div> <p class="text-sm font-black">$4.800</p> </div> </div> </div> <!-- PERFIL --> <div x-show="tab === 'perfil'" class="p-8 animate-fade-in"> <div class="text-center mb-10"> <div class="w-24 h-24 bg-zinc-900 rounded-full border-4 border-[#bef264] mx-auto p-1 mb-4 shadow-[0_0_30px_rgba(190,242,100,0.1)]"> <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="rounded-full"> </div> <h2 class="text-2xl font-black uppercase tracking-tight" x-text="nombre || 'Cargando...'"></h2> <p class="text-[#bef264] font-black text-[10px] tracking-[0.3em] uppercase mt-2">Embajador Verificado</p> </div> <div class="space-y-2"> <div class="bg-card p-5 rounded-2xl flex justify-between items-center"><span class="text-xs font-bold text-zinc-400 italic">ID Usuario</span><span class="text-xs font-black">ALMA-2024-001</span></div> <div class="bg-card p-5 rounded-2xl flex justify-between items-center"><span class="text-xs font-bold text-zinc-400 italic">Estado KYC</span><span class="text-xs font-black text-emerald-400">✓ COMPLETADO</span></div> </div> <button @click="screen = 'bienvenida'; tab = 'inicio'; nombre = '';" class="w-full bg-red-950/30 text-red-500 border border-red-900/40 font-black py-4 rounded-2xl mt-12 text-xs uppercase tracking-widest">Cerrar Sesión</button> </div> <!-- NAVEGACIÓN INFERIOR --> <nav class="fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-white/5 flex justify-around items-center p-5 z-40"> <button @click="tab = 'inicio'" :class="tab === 'inicio' ? 'text-[#bef264] scale-110' : 'text-zinc-700'" class="transition-all"><i class="fas fa-th-large text-xl"></i></button> <button @click="tab = 'equipo'" :class="tab === 'equipo' ? 'text-[#bef264] scale-110' : 'text-zinc-700'" class="transition-all"><i class="fas fa-users text-xl"></i></button> <div class="w-14 h-14 bg-white rounded-full -mt-14 flex items-center justify-center border-8 border-black shadow-2xl active:scale-90 transition-transform cursor-pointer"> <i class="fas fa-plus text-black text-xl"></i> </div> <button @click="tab = 'rangos'" :class="tab === 'rangos' ? 'text-[#bef264] scale-110' : 'text-zinc-700'" class="transition-all"><i class="fas fa-medal text-xl"></i></button> <button @click="tab = 'perfil'" :class="tab === 'perfil' ? 'text-[#bef264] scale-110' : 'text-zinc-700'" class="transition-all"><i class="fas fa-user-circle text-xl"></i></button> </nav> </div> </template> <!-- MODAL DE PAGO --> <div x-show="modalPago" x-cloak class="fixed inset-0 z-[100] flex items-end"> <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" @click="modalPago = false"></div> <div class="bg-zinc-900 w-full rounded-t-[40px] p-10 border-t-2 border-[#bef264] z-[110] animate-slide-up"> <h2 class="text-2xl font-black mb-2 uppercase italic tracking-tighter">Liquidación</h2> <p class="text-zinc-500 text-sm mb-8 font-medium italic">Se enviará una alerta al dueño de Alma Orders.</p> <div class="bg-black p-6 rounded-3xl mb-8 border border-zinc-800"> <p class="text-[9px] text-zinc-500 font-black uppercase mb-1 tracking-widest">Total a recibir hoy</p> <p class="text-5xl font-black lime-accent">$17.500 <span class="text-sm font-normal text-white">USD</span></p> </div> <button @click="modalPago = false; alert('¡Alerta enviada al dueño de Alma Orders! Te notificaremos por WhatsApp cuando el pago se procese.')" class="w-full bg-[#bef264] text-black font-black py-5 rounded-2xl shadow-xl shadow-[#bef264]/20 uppercase text-xs tracking-widest">Solicitar ahora</button> </div> </div> <style> [x-cloak] { display: none !important; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.4s ease-out; } .animate-slide-up { animation: slideUp 0.3s ease-out; } </style> </body> </html>
