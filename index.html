html <!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma Orders - Plataforma Oficial</title>
    <!-- Cargamos Tailwind y Alpine desde servidores seguros -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-[#050505] text-white font-sans antialiased"
    x-data="{ view: 'login', tab: 'inicio', user: { nombre: 'Embajador', ventas: 0, ganancia: 0 }, codigoMaestro: 'ALMA2024', inputCodigo: '', // Función para entrar entrar() { if(this.inputCodigo === this.codigoMaestro) { this.view = 'app' } else { alert('Código incorrecto. Usa: ALMA2024') } } }"
  >
    <!-- 1. PANTALLA DE ACCESO (LOGIN) -->
    <template x-if="view === 'login'">
      <div
        class="min-h-screen flex flex-col items-center justify-center p-10 bg-gradient-to-b from-[#0a0a0a] to-black"
      >
        <!-- LOGO SIMULADO (Cuadro Blanco) -->
        <div
          class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center text-black font-black text-4xl mb-6 shadow-xl"
        >
          AO
        </div>
        <h1
          class="text-3xl font-black text-[#bef264] tracking-tighter mb-2 italic"
        >
          ALMA ORDERS
        </h1>
        <p
          class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.3em] mb-12 text-center"
        >
          Sistema Privado de Embajadores
        </p>
        <div class="w-full max-w-xs space-y-4">
          <input
            type="text"
            x-model="inputCodigo"
            placeholder="CÓDIGO DE INVITACIÓN"
            class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center text-[#bef264] font-bold tracking-widest focus:border-[#bef264] outline-none"
          />
          <button
            @click="entrar()"
            class="w-full bg-[#bef264] text-black font-black py-4 rounded-xl shadow-lg shadow-[#bef264]/20 uppercase text-xs tracking-widest active:scale-95 transition-all"
          >
            Entrar al Panel
          </button>
          <p
            class="text-[9px] text-zinc-600 text-center uppercase font-bold mt-4"
          >
            Acceso restringido para personal autorizado
          </p>
        </div>
      </div>
    </template>
    <!-- 2. PANTALLA PRINCIPAL (APP) -->
    <template x-if="view === 'app'">
      <div class="min-h-screen pb-24 flex flex-col">
        <!-- CABECERA -->
        <header
          class="p-6 bg-zinc-950 border-b border-zinc-900 flex justify-between items-center sticky top-0 z-50"
        >
          <div class="flex items-center gap-2">
            <div
              class="w-6 h-6 bg-white rounded flex items-center justify-center text-black font-bold text-xs italic"
            >
              AO
            </div>
            <span class="font-black text-sm tracking-tighter uppercase"
              >Alma <span class="text-[#bef264]">Orders</span></span
            >
          </div>
          <div class="w-10 h-10 rounded-full border-2 border-[#bef264] p-0.5">
            <img
              src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
              class="rounded-full"
            />
          </div>
        </header>
        <!-- CONTENIDO DINÁMICO -->
        <main class="p-6 flex-1">
          <!-- TAB: INICIO -->
          <div x-show="tab === 'inicio'" class="space-y-6">
            <div
              class="bg-zinc-900/50 p-6 rounded-[32px] border border-zinc-800 flex justify-between items-center"
            >
              <div>
                <p class="text-zinc-500 text-[10px] font-bold uppercase mb-1">
                  Ventas del Mes
                </p>
                <p class="text-4xl font-black" x-text="user.ventas"></p>
              </div>
              <div class="text-right">
                <p class="text-[#bef264] text-[10px] font-bold uppercase mb-1">
                  Ganancia Est.
                </p>
                <p
                  class="text-3xl font-black text-[#bef264]"
                  x-text="'$' + user.ganancia"
                ></p>
              </div>
            </div>
            <!-- Botón de Acción -->
            <button
              @click="user.ventas++; user.ganancia += 10000"
              class="w-full bg-white text-black font-black py-5 rounded-2xl text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all"
            >
              Simular Venta (+1)
            </button>
            <!-- Bono Status -->
            <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
              <h3 class="text-[10px] font-black uppercase text-zinc-500 mb-4">
                Progreso Bono Trimestral
              </h3>
              <div
                class="w-full bg-black h-3 rounded-full overflow-hidden border border-zinc-800"
              >
                <div
                  class="h-full bg-[#bef264] shadow-[0_0_10px_#bef264]"
                  :style="'width:' + (user.ventas >= 100 ? 100 : user.ventas) + '%'"
                ></div>
              </div>
              <p
                class="text-right text-[10px] font-black mt-2 text-[#bef264]"
                x-text="user.ventas + ' / 100 Ventas'"
              ></p>
            </div>
          </div>
          <!-- TAB: EQUIPO -->
          <div x-show="tab === 'equipo'" class="space-y-4">
            <h2 class="text-xl font-black uppercase italic mb-6">
              Mi Red de Referidos
            </h2>
            <div
              class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center font-bold text-xs uppercase text-zinc-500"
                >
                  JP
                </div>
                <div>
                  <p class="text-sm font-bold">Juan Pérez</p>
                  <p class="text-[10px] text-emerald-500 font-bold uppercase">
                    Activo
                  </p>
                </div>
              </div>
              <p class="font-black">$4.200</p>
            </div>
          </div>
          <!-- TAB: PERFIL -->
          <div x-show="tab === 'perfil'" class="text-center pt-10">
            <div
              class="w-24 h-24 mx-auto bg-zinc-900 rounded-full border-4 border-[#bef264] p-1 mb-6 shadow-2xl"
            >
              <img
                src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
                class="rounded-full"
              />
            </div>
            <h2 class="text-2xl font-black uppercase tracking-tight">
              Embajador Alma
            </h2>
            <p
              class="text-[#bef264] font-bold text-[10px] mt-2 uppercase tracking-widest"
            >
              ID: AO-2024-X
            </p>
            <button
              @click="view = 'login'; tab = 'inicio'; user.ventas = 0; user.ganancia = 0"
              class="w-full bg-red-900/20 text-red-500 font-black py-4 rounded-xl mt-20 border border-red-900/30 text-[10px] uppercase tracking-widest"
            >
              Cerrar Sesión
            </button>
          </div>
        </main>
        <!-- NAVEGACIÓN INFERIOR -->
        <nav
          class="fixed bottom-0 w-full bg-black/90 backdrop-blur-xl border-t border-zinc-900 flex justify-around p-5 z-50"
        >
          <button
            @click="tab = 'inicio'"
            :class="tab === 'inicio' ? 'text-[#bef264] scale-125' : 'text-zinc-700'"
            class="transition-all duration-200"
          >
            <i class="fas fa-th-large text-xl"></i>
          </button>
          <button
            @click="tab = 'equipo'"
            :class="tab === 'equipo' ? 'text-[#bef264] scale-125' : 'text-zinc-700'"
            class="transition-all duration-200"
          >
            <i class="fas fa-users text-xl"></i>
          </button>
          <button
            @click="tab = 'perfil'"
            :class="tab === 'perfil' ? 'text-[#bef264] scale-125' : 'text-zinc-700'"
            class="transition-all duration-200"
          >
            <i class="fas fa-user-circle text-xl"></i>
          </button>
        </nav>
      </div>
    </template>
    <!-- ESTILOS EXTRA -->
    <style>
      [x-cloak] {
        display: none !important;
      }
      input::placeholder {
        color: #3f3f46;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
      }
    </style>
  </body>
</html>
