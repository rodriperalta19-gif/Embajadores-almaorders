<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma Orders - Plataforma Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      :root {
        --lima: #bef264;
        --dark: #070707;
        --card: #151515;
      }
      body {
        background-color: var(--dark);
        color: white;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }
      .text-lima {
        color: var(--lima);
      }
      .bg-lima {
        background-color: var(--lima);
        color: black;
      }
      .card {
        background-color: var(--card);
        border: 1px solid #222;
        border-radius: 24px;
      }
      .input-dark {
        background: #000;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 14px;
        width: 100%;
        color: white;
        outline: none;
      }
      .input-dark:focus {
        border-color: var(--lima);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body x-data="appData()">
    <!-- 1. PANTALLA: LOGIN / REGISTRO -->
    <template x-if="view === 'auth'">
      <div
        class="min-h-screen flex flex-col items-center justify-center p-8 bg-black"
      >
        <div
          class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center text-black font-black text-4xl mb-6 italic"
        >
          AO
        </div>
        <h1 class="text-3xl font-black text-lima tracking-tighter mb-2">
          ALMA ORDERS
        </h1>
        <p
          class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.3em] mb-12"
        >
          Acceso Embajadores
        </p>
        <div class="w-full max-w-xs space-y-4">
          <input
            type="text"
            x-model="inputCodigo"
            placeholder="CÓDIGO DE INVITACIÓN"
            class="input-dark text-center font-bold tracking-widest text-lima"
          />
          <button
            @click="login()"
            class="w-full bg-lima text-black font-black py-4 rounded-xl uppercase text-xs tracking-widest shadow-lg shadow-[#bef264]/20 active:scale-95 transition-all"
          >
            Entrar ahora
          </button>
          <p
            class="text-[9px] text-zinc-600 text-center uppercase font-bold mt-4"
          >
            Pide tu código al administrador
          </p>
        </div>
      </div>
    </template>
    <!-- 2. PANTALLA: TÉRMINOS Y CONDICIONES (SÓLO LA PRIMERA VEZ) -->
    <template x-if="view === 'legal'">
      <div class="min-h-screen p-8 flex flex-col bg-black">
        <h2 class="text-2xl font-black text-lima uppercase italic mb-6">
          Avisos Legales
        </h2>
        <div
          class="flex-1 overflow-y-auto bg-zinc-900/30 p-6 rounded-3xl border border-zinc-800 text-[11px] text-zinc-400 leading-relaxed space-y-4 mb-6"
        >
          <p class="font-bold text-white">1. ACUERDO DE EMBAJADOR</p>
          <p>
            Al unirte a Alma Orders, aceptas promocionar nuestras membresías de
            forma ética. Las comisiones se pagan sobre ventas efectivas y
            validadas por la administración.
          </p>
          <p class="font-bold text-white">2. PAGOS Y COMISIONES</p>
          <p>
            La comisión base es del 40%. Los bonos trimestrales y de
            consistencia se calculan automáticamente pero requieren validación
            del dueño de la empresa.
          </p>
        </div>
        <label class="flex items-center gap-3 mb-8 cursor-pointer">
          <input
            type="checkbox"
            x-model="aceptaLegal"
            class="w-5 h-5 accent-[#bef264]"
          />
          <span class="text-[10px] font-bold uppercase"
            >He leído y acepto los términos</span
          >
        </label>
        <button
          @click="view = 'app'"
          :disabled="!aceptaLegal"
          :class="!aceptaLegal ? 'opacity-30' : ''"
          class="w-full bg-lima text-black font-black py-5 rounded-2xl uppercase text-xs tracking-widest transition-all"
        >
          Confirmar y Entrar
        </button>
      </div>
    </template>
    <!-- 3. LA APLICACIÓN PRINCIPAL -->
    <template x-if="view === 'app'">
      <div class="min-h-screen pb-24">
        <header
          class="p-5 flex justify-between items-center border-b border-zinc-900 sticky top-0 z-50 bg-[#070707]/95 backdrop-blur-md"
        >
          <div class="flex items-center gap-2">
            <div
              class="w-7 h-7 bg-white rounded flex items-center justify-center text-black font-black italic text-sm"
            >
              AO
            </div>
            <span class="font-black text-sm tracking-tighter uppercase"
              >ALMA <span class="text-lima">ORDERS</span></span
            >
          </div>
          <div class="w-9 h-9 rounded-full border border-lima overflow-hidden">
            <img :src="profilePhoto" class="w-full h-full object-cover" />
          </div>
        </header>
        <main class="p-5 max-w-lg mx-auto">
          <!-- TAB: INICIO -->
          <div x-show="tab === 'inicio'" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
              <div class="card p-5 text-center">
                <p class="text-zinc-600 text-[9px] font-bold uppercase mb-1">
                  Ventas Mes
                </p>
                <p class="text-3xl font-black text-white" x-text="ventas"></p>
              </div>
              <div class="card p-5 text-center border-lima/20">
                <p class="text-lima text-[9px] font-bold uppercase mb-1">
                  Comisión
                </p>
                <p
                  class="text-3xl font-black text-lima"
                  x-text="'$' + comision"
                ></p>
              </div>
            </div>
            <div class="card p-5">
              <p class="text-[9px] font-bold text-zinc-600 uppercase mb-3">
                Enlace de Referido
              </p>
              <div class="flex gap-2">
                <input
                  type="text"
                  readonly
                  value="almaorders.com/reg?ref=ALMA-7724"
                  class="input-dark text-[9px] flex-1 text-lima font-bold"
                /><button
                  @click="alert('Copiado!')"
                  class="bg-white text-black px-4 rounded-xl text-[9px] font-black uppercase tracking-tighter"
                >
                  Copiar
                </button>
              </div>
            </div>
            <button
              @click="modalVenta = true"
              class="w-full bg-white text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-widest shadow-xl active:scale-95 transition-all"
            >
              Registrar Venta Directa
            </button>
          </div>
          <!-- TAB: MATERIAL -->
          <div x-show="tab === 'material'" class="space-y-6">
            <h2 class="text-xl font-black uppercase italic text-lima">
              Media Kit
            </h2>
            <div class="grid grid-cols-1 gap-4">
              <template x-for="item in mediaKit"
                ><div class="card p-4 flex justify-between items-center">
                  <div class="flex items-center gap-4 text-zinc-400">
                    <i :class="item.icon" class="text-xl"></i>
                    <div>
                      <p
                        class="text-[10px] font-black text-white uppercase"
                        x-text="item.name"
                      ></p>
                      <p class="text-[8px] uppercase" x-text="item.size"></p>
                    </div>
                  </div>
                  <button
                    @click="alert('Iniciando descarga...')"
                    class="w-8 h-8 bg-lima text-black rounded-lg flex items-center justify-center text-xs"
                  >
                    <i class="fas fa-download"></i>
                  </button></div
              ></template>
            </div>
          </div>
          <!-- TAB: RANGOS -->
          <div x-show="tab === 'rangos'" class="space-y-8">
            <h2 class="text-xl font-black uppercase italic text-lima">
              Ruta de Éxito
            </h2>
            <div class="relative pl-8 border-l border-zinc-800 space-y-10">
              <template x-for="rango in rangos"
                ><div class="relative">
                  <div
                    class="absolute -left-[36.5px] top-1 w-3 h-3 rounded-full border-2 border-black shadow-lg"
                    :class="historia >= rango.min ? 'bg-lima' : 'bg-zinc-800'"
                  ></div>
                  <div
                    class="card p-4"
                    :class="historia >= rango.min ? 'border-lima/30' : 'opacity-40'"
                  >
                    <h4
                      class="font-black text-[10px] uppercase"
                      x-text="rango.nombre"
                    ></h4>
                    <p
                      class="text-[8px] text-zinc-500 mt-1 uppercase"
                      x-text="'Premio: ' + rango.premio"
                    ></p>
                    <template x-if="historia >= rango.min && !rango.reclamado"
                      ><button
                        @click="rango.reclamado = true; alert('¡Reclamado!')"
                        class="mt-4 w-full bg-white text-black font-black py-2 rounded-lg text-[9px] uppercase tracking-widest"
                      >
                        Reclamar
                      </button></template
                    >
                  </div>
                </div></template
              >
            </div>
          </div>
          <!-- TAB: SOPORTE -->
          <div x-show="tab === 'soporte'" class="flex flex-col h-[65vh]">
            <h2 class="text-xl font-black uppercase italic text-lima mb-6">
              Ayuda Directa
            </h2>
            <div class="flex-1 overflow-y-auto space-y-4 p-2 no-scrollbar">
              <template x-for="msg in chat"
                ><div
                  class="flex"
                  :class="msg.role === 'user' ? 'justify-end' : 'justify-start'"
                >
                  <div
                    class="p-3 max-w-[80%] text-[11px] font-medium rounded-2xl"
                    :class="msg.role === 'user' ? 'bg-lima text-black' : 'bg-zinc-800 text-white'"
                    x-text="msg.text"
                  ></div></div
              ></template>
            </div>
            <div class="mt-4 flex gap-2">
              <input
                type="text"
                x-model="nuevoMensaje"
                @keyup.enter="enviarMensaje()"
                placeholder="Escribe..."
                class="input-dark flex-1 text-[11px]"
              /><button
                @click="enviarMensaje()"
                class="bg-lima text-black w-12 h-12 rounded-xl flex items-center justify-center"
              >
                <i class="fas fa-paper-plane"></i>
              </button>
            </div>
          </div>
          <!-- TAB: PERFIL -->
          <div x-show="tab === 'perfil'" class="text-center space-y-10 pt-10">
            <div class="relative w-28 h-28 mx-auto">
              <img
                :src="profilePhoto"
                class="w-full h-full rounded-full border-4 border-lima p-1 shadow-2xl object-cover"
              /><label
                class="absolute bottom-0 right-0 bg-white text-black w-9 h-9 rounded-full flex items-center justify-center cursor-pointer shadow-xl"
                ><i class="fas fa-camera text-sm"></i
                ><input
                  type="file"
                  @change="uploadPhoto"
                  class="hidden"
                  accept="image/*"
              /></label>
            </div>
            <div>
              <h2 class="text-2xl font-black uppercase tracking-tighter">
                Socio Fundador
              </h2>
              <p
                class="text-lima font-bold text-[9px] mt-2 uppercase tracking-[0.3em]"
              >
                ID: ALMA-7724
              </p>
            </div>
            <button
              @click="location.reload()"
              class="w-full bg-red-950/20 text-red-500 font-black py-4 rounded-xl border border-red-900/20 text-[10px] uppercase tracking-[0.2em]"
            >
              Cerrar Sesión
            </button>
          </div>
        </main>
        <!-- NAV INFERIOR -->
        <nav
          class="fixed bottom-0 left-0 w-full p-5 z-50 flex justify-around items-center bg-black/95 border-t border-zinc-900 backdrop-blur-md"
        >
          <button
            @click="tab = 'inicio'"
            :class="tab === 'inicio' ? 'text-lima scale-125' : 'text-zinc-700'"
          >
            <i class="fas fa-home text-xl"></i>
          </button>
          <button
            @click="tab = 'material'"
            :class="tab === 'material' ? 'text-lima scale-125' : 'text-zinc-600'"
          >
            <i class="fas fa-images text-xl"></i>
          </button>
          <button
            @click="tab = 'rangos'"
            :class="tab === 'rangos' ? 'text-lima scale-125' : 'text-zinc-600'"
          >
            <i class="fas fa-medal text-xl"></i>
          </button>
          <button
            @click="tab = 'soporte'"
            :class="tab === 'soporte' ? 'text-lima scale-125' : 'text-zinc-600'"
          >
            <i class="fas fa-headset text-xl"></i>
          </button>
          <button
            @click="tab = 'perfil'"
            :class="tab === 'perfil' ? 'text-lima scale-125' : 'text-zinc-600'"
          >
            <i class="fas fa-user-circle text-xl"></i>
          </button>
        </nav>
      </div>
    </template>
    <!-- MODAL VENTA -->
    <div
      x-show="modalVenta"
      x-cloak
      class="fixed inset-0 z-[100] flex items-end"
    >
      <div
        class="absolute inset-0 bg-black/95 backdrop-blur-sm"
        @click="modalVenta = false"
      ></div>
      <div
        class="bg-[#111] w-full rounded-t-[40px] p-10 border-t-2 border-lima z-[110] animate-slide-up"
      >
        <h2 class="text-xl font-black mb-8 uppercase text-center">
          Registrar Venta
        </h2>
        <div class="space-y-4">
          <button
            @click="addSale(35000)"
            class="w-full bg-lima text-black font-black py-4 rounded-xl text-[10px] uppercase"
          >
            Elite ($35k)</button
          ><button
            @click="addSale(25000)"
            class="w-full bg-zinc-800 text-white font-black py-4 rounded-xl text-[10px] uppercase"
          >
            Avanzada ($25k)
          </button>
        </div>
      </div>
    </div>
    <script>
      function appData() {
        return {
          view: "auth",
          tab: "inicio",
          inputCodigo: "",
          aceptaLegal: false,
          ventas: 0,
          comision: 0,
          historia: 0,
          profilePhoto: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
          modalVenta: false,
          nuevoMensaje: "",
          chat: [
            { id: 1, role: "admin", text: "¡Hola! Bienvenido a Alma Orders." },
          ],
          rangos: [
            {
              id: 1,
              nombre: "Bronce",
              min: 0,
              premio: "Kit Digital",
              reclamado: false,
            },
            {
              id: 2,
              nombre: "Plata",
              min: 25000,
              premio: "Tablet",
              reclamado: false,
            },
            {
              id: 3,
              nombre: "Oro",
              min: 100000,
              premio: "Bono $500",
              reclamado: false,
            },
          ],
          mediaKit: [
            {
              id: 1,
              name: "Banners Redes",
              size: "2.4 MB",
              icon: "fas fa-image",
            },
            {
              id: 2,
              name: "Video Promocional",
              size: "15.8 MB",
              icon: "fas fa-video",
            },
            {
              id: 3,
              name: "Logos Oficiales",
              size: "5.0 MB",
              icon: "fas fa-file-archive",
            },
          ],
          login() {
            if (this.inputCodigo === "ALMA2024") this.view = "legal";
            else alert("Código: ALMA2024");
          },
          addSale(monto) {
            this.ventas++;
            this.comision += monto * 0.4;
            this.historia += monto;
            this.modalVenta = false;
          },
          enviarMensaje() {
            if (this.nuevoMensaje) {
              this.chat.push({
                id: Date.now(),
                role: "user",
                text: this.nuevoMensaje,
              });
              this.nuevoMensaje = "";
              setTimeout(() => {
                this.chat.push({
                  id: Date.now() + 1,
                  role: "admin",
                  text: "Recibido. Responderemos pronto.",
                });
              }, 1000);
            }
          },
          uploadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (e) => {
                this.profilePhoto = e.target.result;
              };
              reader.readAsDataURL(file);
            }
          },
        };
      }
    </script>
  </body>
</html>
