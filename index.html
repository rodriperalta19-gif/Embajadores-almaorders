```html <!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma Orders - Sistema de Embajadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      .emerald-glow {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      }
      .bg-dark-card {
        background: #121212;
        border: 1px solid rgba(16, 185, 129, 0.15);
      }
      .lime-accent {
        color: #bef264;
      } /* Verde lima del logo */
    </style>
  </head>
  <body
    class="bg-black text-white font-sans overflow-x-hidden selection:bg-emerald-500/30"
    x-data="{ tab: 'inicio', modalPago: false, userRole: 'admin' }"
  >
    <!-- 1. DASHBOARD DEL EMBAJADOR -->
    <template x-if="tab === 'inicio'">
      <div class="pb-24 animate-[fadeIn_0.3s]">
        <header
          class="p-8 bg-gradient-to-b from-emerald-900/40 to-black rounded-b-[40px] border-b border-emerald-500/20"
        >
          <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
              <div
                class="w-10 h-10 bg-white rounded-lg flex items-center justify-center font-black text-black text-xl italic"
              >
                AO
              </div>
              <h1 class="text-2xl font-black lime-accent">ALMA ORDERS</h1>
            </div>
            <div
              @click="tab = 'perfil'"
              class="w-10 h-10 rounded-full border border-emerald-500 overflow-hidden cursor-pointer"
            >
              <img
                src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
                alt="Avatar"
              />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-2">
            <div class="bg-dark-card p-5 rounded-[28px]">
              <p
                class="text-gray-500 text-[10px] uppercase font-bold tracking-tighter"
              >
                Ventas Personales
              </p>
              <p class="text-2xl font-black text-white">$12.500</p>
            </div>
            <div class="bg-dark-card p-5 rounded-[28px] border-emerald-500/40">
              <p
                class="text-emerald-500 text-[10px] uppercase font-bold tracking-tighter"
              >
                Comisión Est.
              </p>
              <p class="text-2xl font-black lime-accent text-emerald-400">
                $5.000
              </p>
            </div>
          </div>
        </header>
        <main class="p-6 space-y-6">
          <!-- Bono de Consistencia -->
          <section class="bg-dark-card p-6 rounded-[32px]">
            <h3 class="font-bold text-sm mb-4 flex items-center gap-2">
              <i class="fas fa-calendar-check text-emerald-500"></i> BONO
              CONSISTENCIA (2/3)
            </h3>
            <div class="flex gap-2">
              <div
                class="h-1.5 flex-1 bg-emerald-500 rounded-full emerald-glow"
              ></div>
              <div
                class="h-1.5 flex-1 bg-emerald-500 rounded-full emerald-glow"
              ></div>
              <div class="h-1.5 flex-1 bg-zinc-800 rounded-full"></div>
            </div>
            <p class="text-[10px] text-gray-500 mt-3 italic font-medium">
              Mantén 20 ventas mensuales para ganar $50.000
            </p>
          </section>
          <!-- Bono Trimestral -->
          <section
            class="bg-dark-card p-6 rounded-[32px] border-2 border-emerald-500/30"
          >
            <div class="flex justify-between items-end mb-4">
              <div>
                <h3 class="font-bold text-sm uppercase">Bono Trimestral</h3>
                <p
                  class="text-[10px] text-emerald-500 font-bold tracking-widest mt-1"
                >
                  OBJETIVO: 100 VENTAS
                </p>
              </div>
              <p class="text-2xl font-black">82%</p>
            </div>
            <div
              class="w-full bg-zinc-900 h-4 rounded-full overflow-hidden p-0.5"
            >
              <div
                class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full emerald-glow transition-all duration-1000"
                style="width: 82%"
              ></div>
            </div>
            <div
              class="flex justify-between mt-2 text-[10px] text-gray-400 font-bold uppercase"
            >
              <span>Faltan 18 ventas</span> <span>Pre-Bono: $60.000</span>
            </div>
          </section>
          <button
            @click="modalPago = true"
            class="w-full bg-white text-black font-black py-5 rounded-2xl active:scale-95 transition-all text-sm uppercase tracking-widest"
          >
            SOLICITAR CIERRE DE PAGO
          </button>
        </main>
      </div>
    </template>
    <!-- 2. LISTADO DE VENTAS -->
    <template x-if="tab === 'ventas'">
      <div class="pb-24 animate-[fadeIn_0.3s]">
        <header class="p-8 border-b border-zinc-800">
          <h1 class="text-2xl font-black lime-accent uppercase">
            Historial de Ventas
          </h1>
          <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
            <span
              class="px-4 py-1.5 bg-emerald-500 text-black rounded-full text-[10px] font-black uppercase"
              >Todas</span
            >
            <span
              class="px-4 py-1.5 bg-zinc-900 border border-zinc-800 rounded-full text-[10px] font-black uppercase"
              >Pendientes</span
            >
            <span
              class="px-4 py-1.5 bg-zinc-900 border border-zinc-800 rounded-full text-[10px] font-black uppercase"
              >Pagadas</span
            >
          </div>
        </header>
        <div class="p-6 space-y-3">
          <div
            class="bg-dark-card p-4 rounded-2xl flex justify-between items-center"
          >
            <div>
              <p class="text-xs font-bold">Membresía Elite - Juan R.</p>
              <p class="text-[10px] text-gray-500">24 Mayo, 2024</p>
            </div>
            <div class="text-right">
              <p class="text-sm font-black text-emerald-400">+$14.000</p>
              <span
                class="text-[8px] bg-emerald-500/10 text-emerald-500 px-2 py-0.5 rounded border border-emerald-500/30 uppercase font-black"
                >Pagada</span
              >
            </div>
          </div>
          <div
            class="bg-dark-card p-4 rounded-2xl flex justify-between items-center opacity-70"
          >
            <div>
              <p class="text-xs font-bold">Membresía Avanzado - Ana L.</p>
              <p class="text-[10px] text-gray-500">23 Mayo, 2024</p>
            </div>
            <div class="text-right">
              <p class="text-sm font-black text-white">+$10.000</p>
              <span
                class="text-[8px] bg-yellow-500/10 text-yellow-500 px-2 py-0.5 rounded border border-yellow-500/30 uppercase font-black"
                >Pendiente</span
              >
            </div>
          </div>
        </div>
      </div>
    </template>
    <!-- 3. RANGOS Y RECOMPENSAS -->
    <template x-if="tab === 'rangos'">
      <div class="pb-24 animate-[fadeIn_0.3s]">
        <header
          class="p-8 bg-zinc-950 text-center border-b border-emerald-500/30"
        >
          <div
            class="w-20 h-20 bg-emerald-600 rounded-full mx-auto flex items-center justify-center emerald-glow mb-4"
          >
            <i class="fas fa-trophy text-3xl text-black"></i>
          </div>
          <h2 class="text-xl font-black lime-accent uppercase">Rango Oro</h2>
          <p
            class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest font-bold"
          >
            Histórico Acumulado: $45.200
          </p>
        </header>
        <div class="p-8 space-y-6">
          <div class="relative border-l-2 border-emerald-500/30 pl-8 pb-4">
            <div
              class="absolute -left-1.5 top-0 w-3 h-3 bg-emerald-500 rounded-full"
            ></div>
            <h4 class="font-black text-emerald-400 text-sm">BRONCE</h4>
            <p class="text-[10px] text-gray-500 uppercase mt-1">
              Premio: Kit de Bienvenida (ENTREGADO)
            </p>
          </div>
          <div class="relative border-l-2 border-emerald-500/30 pl-8 pb-4">
            <div
              class="absolute -left-1.5 top-0 w-3 h-3 bg-emerald-500 rounded-full emerald-glow"
            ></div>
            <div
              class="bg-emerald-900/20 p-4 rounded-2xl border border-emerald-500/40"
            >
              <h4 class="font-black text-white text-sm">PLATA</h4>
              <p class="text-[10px] text-gray-300 mt-1 uppercase">
                Premio: Tablet Android
              </p>
              <button
                class="mt-4 w-full bg-white text-black font-black py-2 rounded-xl text-[10px] uppercase"
              >
                Reclamar Premio
              </button>
            </div>
          </div>
          <div class="relative pl-8">
            <div
              class="absolute -left-1.5 top-0 w-3 h-3 bg-zinc-800 rounded-full"
            ></div>
            <h4 class="font-black text-zinc-600 text-sm">PLATINO</h4>
            <p
              class="text-[10px] text-zinc-800 uppercase mt-1 font-bold italic"
            >
              Bloqueado hasta los $50.000
            </p>
          </div>
        </div>
      </div>
    </template>
    <!-- 4. PERFIL / AJUSTES -->
    <template x-if="tab === 'perfil'">
      <div class="pb-24 animate-[fadeIn_0.3s]">
        <header class="p-12 text-center bg-zinc-950">
          <div
            class="w-24 h-24 mx-auto rounded-full border-4 border-emerald-500 p-1 mb-4"
          >
            <img
              src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
              class="rounded-full"
            />
          </div>
          <h2 class="text-2xl font-black uppercase">Carlos Mendoza</h2>
          <span
            class="px-4 py-1 bg-emerald-500/10 text-emerald-500 rounded-full text-[10px] font-black border border-emerald-500/30"
            >ID: AO-10024</span
          >
        </header>
        <div class="p-6 space-y-3">
          <div
            class="bg-dark-card p-5 rounded-2xl flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <i class="fas fa-user-shield text-emerald-500"></i>
              <span class="text-sm font-bold">Verificación KYC</span>
            </div>
            <span class="text-[10px] font-black text-emerald-500 uppercase"
              >Validado</span
            >
          </div>
          <div
            class="bg-dark-card p-5 rounded-2xl flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <i class="fas fa-wallet text-emerald-500"></i>
              <span class="text-sm font-bold">Métodos de Cobro</span>
            </div>
            <i class="fas fa-chevron-right text-zinc-700 text-xs"></i>
          </div>
          <button
            class="w-full bg-red-900/20 text-red-500 border border-red-500/30 font-black py-4 rounded-2xl mt-8 text-xs uppercase tracking-widest"
          >
            Cerrar Sesión
          </button>
        </div>
      </div>
    </template>
    <!-- MODAL DE CIERRE DE PAGO -->
    <div x-show="modalPago" x-cloak class="fixed inset-0 z-50 flex items-end">
      <div
        class="absolute inset-0 bg-black/95 backdrop-blur-md"
        @click="modalPago = false"
      ></div>
      <div
        class="bg-zinc-900 w-full rounded-t-[40px] p-10 border-t-2 border-emerald-500 z-50 animate-[slideUp_0.3s]"
      >
        <div class="w-12 h-1 bg-zinc-800 mx-auto rounded-full mb-8"></div>
        <h2 class="text-2xl font-black mb-6 lime-accent uppercase italic">
          Solicitud de Pago
        </h2>
        <div class="bg-black p-6 rounded-3xl mb-8 border border-zinc-800">
          <p
            class="text-[10px] text-zinc-500 font-black uppercase mb-1 tracking-widest"
          >
            Total acumulado a pagar
          </p>
          <div class="flex items-end gap-2">
            <span class="text-5xl font-black text-white">$17.500</span>
            <span class="text-emerald-500 font-bold mb-2 uppercase">USD</span>
          </div>
        </div>
        <div class="space-y-4 mb-8">
          <div class="flex justify-between items-center text-xs">
            <span class="text-zinc-500 font-medium italic"
              >Comisiones Ventas Personales</span
            >
            <span class="text-white font-black">$12.500</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-zinc-500 font-medium italic"
              >Bonos Especiales Alcanzados</span
            >
            <span class="text-white font-black">$5.000</span>
          </div>
        </div>
        <button
          @click="modalPago = false; alert('¡Solicitud enviada al dueño de Alma Orders! Recibirás una notificación cuando el pago sea procesado.')"
          class="w-full bg-emerald-500 text-black font-black py-5 rounded-2xl text-sm uppercase emerald-glow shadow-xl shadow-emerald-500/20 active:scale-95 transition-all"
        >
          CONFIRMAR Y SOLICITAR
        </button>
      </div>
    </div>
    <!-- NAVEGACIÓN INFERIOR (MAESTRA) -->
    <nav
      class="fixed bottom-0 w-full bg-black/90 backdrop-blur-xl border-t border-emerald-500/20 flex justify-around items-center p-4 z-40 shadow-[0_-5px_25px_rgba(0,0,0,0.8)]"
    >
      <button
        @click="tab = 'inicio'"
        :class="tab === 'inicio' ? 'text-emerald-400 scale-110' : 'text-zinc-600'"
        class="flex flex-col items-center transition-all"
      >
        <i class="fas fa-home text-xl"></i>
        <span class="text-[8px] font-black mt-1 uppercase tracking-tighter"
          >Inicio</span
        >
      </button>
      <button
        @click="tab = 'ventas'"
        :class="tab === 'ventas' ? 'text-emerald-400 scale-110' : 'text-zinc-600'"
        class="flex flex-col items-center transition-all"
      >
        <i class="fas fa-chart-pie text-xl"></i>
        <span class="text-[8px] font-black mt-1 uppercase tracking-tighter"
          >Ventas</span
        >
      </button>
      <div
        class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center -mt-12 border-[6px] border-black shadow-lg shadow-emerald-500/30 transition-transform active:scale-90 cursor-pointer"
      >
        <i class="fas fa-plus text-black text-xl"></i>
      </div>
      <button
        @click="tab = 'rangos'"
        :class="tab === 'rangos' ? 'text-emerald-400 scale-110' : 'text-zinc-600'"
        class="flex flex-col items-center transition-all"
      >
        <i class="fas fa-trophy text-xl"></i>
        <span class="text-[8px] font-black mt-1 uppercase tracking-tighter"
          >Rangos</span
        >
      </button>
      <button
        @click="tab = 'perfil'"
        :class="tab === 'perfil' ? 'text-emerald-400 scale-110' : 'text-zinc-600'"
        class="flex flex-col items-center transition-all"
      >
        <i class="fas fa-user-circle text-xl"></i>
        <span class="text-[8px] font-black mt-1 uppercase tracking-tighter"
          >Perfil</span
        >
      </button>
    </nav>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </body>
</html>
``` ###
