```html <!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Alma Orders Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      .lime-accent {
        color: #bef264;
      }
      .bg-admin-card {
        background: #111111;
        border: 1px solid rgba(190, 242, 100, 0.1);
      }
      .btn-lime {
        background: #bef264;
        color: black;
        font-weight: 900;
      }
    </style>
  </head>
  <body
    class="bg-black text-white font-sans"
    x-data="{ tab: 'resumen', modalDetalle: false }"
  >
    <!-- BARRA LATERAL / NAVEGACIÓN SUPERIOR -->
    <header class="p-6 bg-zinc-950 border-b border-zinc-800 sticky top-0 z-50">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 bg-[#bef264] rounded flex items-center justify-center text-black font-black italic"
          >
            A
          </div>
          <h1 class="text-xl font-black tracking-tighter uppercase">
            Admin <span class="lime-accent">Alma Orders</span>
          </h1>
        </div>
        <button class="text-zinc-500"><i class="fas fa-bell"></i></button>
      </div>
      <!-- Tabs de Navegación -->
      <nav
        class="flex gap-4 mt-6 overflow-x-auto no-scrollbar text-[10px] font-black uppercase tracking-widest"
      >
        <button
          @click="tab = 'resumen'"
          :class="tab === 'resumen' ? 'lime-accent border-b-2 border-[#bef264]' : 'text-zinc-600'"
          class="pb-2 transition-all"
        >
          Resumen
        </button>
        <button
          @click="tab = 'pagos'"
          :class="tab === 'pagos' ? 'lime-accent border-b-2 border-[#bef264]' : 'text-zinc-600'"
          class="pb-2 transition-all"
        >
          Pagos
        </button>
        <button
          @click="tab = 'usuarios'"
          :class="tab === 'usuarios' ? 'lime-accent border-b-2 border-[#bef264]' : 'text-zinc-600'"
          class="pb-2 transition-all"
        >
          Embajadores
        </button>
        <button
          @click="tab = 'config'"
          :class="tab === 'config' ? 'lime-accent border-b-2 border-[#bef264]' : 'text-zinc-600'"
          class="pb-2 transition-all"
        >
          Reglas
        </button>
      </nav>
    </header>
    <!-- 1. RESUMEN EJECUTIVO (GANANCIAS) -->
    <template x-if="tab === 'resumen'">
      <main class="p-6 space-y-6 animate-[fadeIn_0.3s]">
        <section class="grid grid-cols-1 gap-4">
          <div
            class="bg-admin-card p-6 rounded-[32px] relative overflow-hidden"
          >
            <p class="text-zinc-500 text-xs font-bold uppercase mb-1">
              Ganancia Neta Mensual
            </p>
            <h2 class="text-4xl font-black text-white">
              $450.000 <span class="text-xs lime-accent">USD</span>
            </h2>
            <div
              class="mt-4 h-16 w-full bg-emerald-900/10 rounded-xl border border-emerald-500/20 flex items-center justify-center"
            >
              <p class="text-[10px] text-emerald-400 font-bold uppercase">
                <i class="fas fa-chart-line mr-2"></i>+15% respecto al mes
                anterior
              </p>
            </div>
          </div>
        </section>
        <section class="grid grid-cols-2 gap-4">
          <div class="bg-zinc-900/50 p-4 rounded-3xl border border-zinc-800">
            <p class="text-zinc-500 text-[10px] font-bold uppercase mb-1">
              Suscripciones
            </p>
            <p class="text-xl font-black text-white">1,240</p>
          </div>
          <div
            class="bg-zinc-900/50 p-4 rounded-3xl border border-zinc-800 text-red-400"
          >
            <p class="text-zinc-500 text-[10px] font-bold uppercase mb-1">
              Pagos Pend.
            </p>
            <p class="text-xl font-black">$124,000</p>
          </div>
        </section>
        <h3 class="font-black text-xs uppercase text-zinc-500 mt-8 mb-4">
          Alertas de Bonos Alcanzados
        </h3>
        <div class="space-y-3">
          <div
            class="bg-zinc-900 p-4 rounded-2xl flex justify-between items-center border-l-4 border-[#bef264]"
          >
            <div>
              <p class="text-sm font-bold">Carlos Mendoza</p>
              <p
                class="text-[10px] text-zinc-500 uppercase font-black tracking-widest"
              >
                Bono Trimestral (100 Ventas)
              </p>
            </div>
            <button
              @click="modalDetalle = true"
              class="btn-lime px-4 py-2 rounded-xl text-[10px]"
            >
              VERIFICAR
            </button>
          </div>
        </div>
      </main>
    </template>
    <!-- 2. GESTIÓN DE PAGOS -->
    <template x-if="tab === 'pagos'">
      <main class="p-6 space-y-4 animate-[fadeIn_0.3s]">
        <h2 class="text-xl font-black mb-6">Cierre de Caja</h2>
        <div class="space-y-3">
          <div class="bg-admin-card p-4 rounded-2xl">
            <div class="flex justify-between items-start mb-4">
              <div>
                <p class="text-sm font-black">Ana Martinez</p>
                <p class="text-[10px] text-zinc-500">
                  Saldo acumulado: $25.400
                </p>
              </div>
              <span
                class="text-[8px] bg-red-500/10 text-red-500 px-2 py-1 rounded border border-red-500/20 font-black uppercase tracking-widest"
                >Pendiente</span
              >
            </div>
            <button
              class="w-full bg-zinc-800 text-white font-black py-3 rounded-xl text-xs uppercase"
            >
              Confirmar Transferencia
            </button>
          </div>
        </div>
      </main>
    </template>
    <!-- 3. CONFIGURACIÓN DE REGLAS (EL CORAZÓN) -->
    <template x-if="tab === 'config'">
      <main class="p-6 space-y-6 animate-[fadeIn_0.3s]">
        <h2 class="text-xl font-black mb-4">Configuración de Comisiones</h2>
        <div class="bg-admin-card p-6 rounded-3xl space-y-6">
          <div>
            <label
              class="text-[10px] font-black text-zinc-500 uppercase block mb-2"
              >Comisión Base Membresías (%)</label
            >
            <input
              type="number"
              value="40"
              class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-xl font-black lime-accent focus:border-[#bef264] outline-none"
            />
          </div>
          <div>
            <label
              class="text-[10px] font-black text-zinc-500 uppercase block mb-2"
              >Bono Trimestral Nivel 1 ($)</label
            >
            <input
              type="number"
              value="60000"
              class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-xl font-black text-white focus:border-[#bef264] outline-none"
            />
          </div>
          <button
            class="btn-lime w-full py-4 rounded-2xl uppercase tracking-widest text-sm shadow-lg shadow-[#bef264]/20"
          >
            Guardar Cambios
          </button>
        </div>
      </main>
    </template>
    <!-- MODAL DE DETALLE DE PAGO / ALERTA -->
    <div
      x-show="modalDetalle"
      x-cloak
      class="fixed inset-0 z-[100] flex items-end"
    >
      <div
        class="absolute inset-0 bg-black/90"
        @click="modalDetalle = false"
      ></div>
      <div
        class="bg-zinc-900 w-full rounded-t-[40px] p-8 border-t-2 border-[#bef264] z-[110] animate-[slideUp_0.3s]"
      >
        <h2 class="text-xl font-black mb-4 uppercase">Validación de Bono</h2>
        <div class="space-y-4 mb-8">
          <div
            class="flex justify-between p-3 bg-black rounded-xl border border-zinc-800"
          >
            <span class="text-zinc-500 text-xs uppercase font-bold"
              >Embajador</span
            >
            <span class="font-black text-white">Carlos Mendoza</span>
          </div>
          <div
            class="flex justify-between p-3 bg-black rounded-xl border border-zinc-800"
          >
            <span class="text-zinc-500 text-xs uppercase font-bold"
              >Ventas Requeridas</span
            >
            <span class="font-black text-white">100</span>
          </div>
          <div
            class="flex justify-between p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/30"
          >
            <span class="text-emerald-500 text-xs uppercase font-bold"
              >Ventas Logradas</span
            >
            <span class="font-black text-emerald-500 text-lg">104</span>
          </div>
        </div>
        <button
          @click="modalDetalle = false; alert('Bono aprobado. El saldo se ha actualizado en la cuenta del embajador.')"
          class="btn-lime w-full py-5 rounded-2xl uppercase tracking-widest text-sm shadow-xl shadow-[#bef264]/30"
        >
          APROBAR Y PAGAR
        </button>
      </div>
    </div>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </body>
</html>
``` ###
