<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma Orders v3.0 - Plataforma Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      :root {
        --lima: #bef264;
        --dark: #050505;
        --card: #121212;
      }
      body {
        background-color: var(--dark);
        color: white;
        font-family: "Inter", sans-serif;
      }
      .text-lima {
        color: var(--lima);
      }
      .bg-lima {
        background-color: var(--lima);
        color: black;
      }
      .card {
        background-color: var(--card);
        border: 1px solid #222;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .input-dark {
        background: #000;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 14px;
        width: 100%;
        color: white;
        outline: none;
        transition: 0.3s;
      }
      .input-dark:focus {
        border-color: var(--lima);
        box-shadow: 0 0 10px rgba(190, 242, 100, 0.2);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .animate-up {
        animation: slideUp 0.3s ease-out;
      }
    </style>
  </head>
  <body x-data="appData()" class="antialiased overflow-x-hidden">
    <!-- 1. PANTALLA: LOGIN / ACCESO -->
    <template x-if="view === 'auth'">
      <div class="min-h-screen flex flex-col items-center justify-center p-8">
        <div
          class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-black font-black text-5xl mb-8 italic shadow-2xl"
        >
          AO
        </div>
        <h1 class="text-3xl font-black text-lima tracking-tighter mb-1 italic">
          ALMA ORDERS
        </h1>
        <p
          class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.4em] mb-12"
        >
          Official Platform
        </p>
        <div class="w-full max-w-xs space-y-4">
          <input
            type="text"
            x-model="inputCodigo"
            placeholder="CÓDIGO DE INVITACIÓN"
            class="input-dark text-center font-bold tracking-widest text-lima uppercase"
          />
          <button
            @click="login()"
            class="w-full bg-lima text-black font-black py-4 rounded-xl uppercase text-xs tracking-widest shadow-lg shadow-[#bef264]/30 active:scale-95 transition-all"
          >
            Ingresar al Sistema
          </button>
          <p
            class="text-[9px] text-zinc-600 text-center uppercase font-bold mt-4 tracking-widest"
          >
            Pide tu acceso al administrador
          </p>
        </div>
      </div>
    </template>
    <!-- 2. PANTALLA: TÉRMINOS Y CONDICIONES -->
    <template x-if="view === 'legal'">
      <div class="min-h-screen p-8 flex flex-col bg-black animate-up">
        <h2 class="text-2xl font-black text-lima uppercase italic mb-6">
          Avisos Legales
        </h2>
        <div
          class="flex-1 overflow-y-auto bg-zinc-900/20 p-6 rounded-3xl border border-zinc-800 text-[11px] text-zinc-400 space-y-5 mb-6 leading-relaxed no-scrollbar"
        >
          <p class="text-white font-bold uppercase tracking-widest">
            1. Introducción
          </p>
          <p>
            Al unirte a Alma Orders, te conviertes en embajador independiente de
            nuestra plataforma SaaS. Aceptas promocionar nuestras membresías
            Elite y Avanzado de forma ética.
          </p>
          <p class="text-white font-bold uppercase tracking-widest">
            2. Comisiones y Bonos
          </p>
          <p>
            Recibirás un 40% sobre ventas directas. Los bonos trimestrales
            ($60k/$90k) y de consistencia ($50k) están sujetos a validación de
            pagos reales por parte de la empresa.
          </p>
          <p class="text-white font-bold uppercase tracking-widest">
            3. Rescisión
          </p>
          <p>
            Alma Orders se reserva el derecho de anular cuentas en caso de
            detectar fraude o spam masivo.
          </p>
        </div>
        <label class="flex items-center gap-4 mb-8 cursor-pointer group">
          <input
            type="checkbox"
            x-model="aceptaLegal"
            class="w-6 h-6 rounded border-zinc-700 bg-black text-lima focus:ring-lima"
          />
          <span
            class="text-[10px] font-bold uppercase text-zinc-300 group-hover:text-white transition-colors"
            >He leído y acepto los términos de servicio</span
          >
        </label>
        <button
          @click="view = 'app'"
          :disabled="!aceptaLegal"
          :class="!aceptaLegal ? 'opacity-20 grayscale' : ''"
          class="w-full bg-lima text-black font-black py-5 rounded-2xl uppercase text-xs tracking-widest transition-all shadow-xl"
        >
          Confirmar y Acceder
        </button>
      </div>
    </template>
    <!-- 3. APLICACIÓN PRINCIPAL -->
    <template x-if="view === 'app'">
      <div class="min-h-screen pb-28">
        <!-- CABECERA FIJA -->
        <header
          class="p-5 flex justify-between items-center border-b border-zinc-900 sticky top-0 z-[100] bg-black/95 backdrop-blur-lg"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-black font-black italic text-lg shadow-lg"
            >
              AO
            </div>
            <span class="font-black text-lg tracking-tighter uppercase"
              >ALMA <span class="text-lima">ORDERS</span></span
            >
          </div>
          <div
            @click="tab = 'perfil'"
            class="w-10 h-10 rounded-full border-2 border-lima p-0.5 cursor-pointer shadow-lg shadow-lima/20"
          >
            <img
              :src="profilePhoto"
              class="w-full h-full rounded-full object-cover"
            />
          </div>
        </header>
        <main class="p-6 max-w-lg mx-auto">
          <!-- TAB: INICIO (DASHBOARD) -->
          <div x-show="tab === 'inicio'" class="space-y-6 animate-up">
            <div class="grid grid-cols-2 gap-4">
              <div class="card p-6 text-center">
                <p class="text-zinc-600 text-[10px] font-bold uppercase mb-1">
                  Ventas Mensuales
                </p>
                <p class="text-4xl font-black text-white" x-text="ventas"></p>
              </div>
              <div class="card p-6 text-center border-lima/30">
                <p class="text-lima text-[10px] font-bold uppercase mb-1">
                  Comisión Generada
                </p>
                <p
                  class="text-3xl font-black text-lima"
                  x-text="'$' + comision"
                ></p>
              </div>
            </div>
            <div class="card p-6">
              <div class="flex justify-between items-center mb-4">
                <p
                  class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic"
                >
                  Hacia Bono Trimestral
                </p>
                <span
                  class="text-lima font-black text-xs"
                  x-text="ventas + ' / 100'"
                ></span>
              </div>
              <div
                class="w-full bg-black h-4 rounded-full border border-zinc-800 p-1"
              >
                <div
                  class="h-full bg-lima rounded-full shadow-[0_0_15px_#bef264] transition-all duration-700"
                  :style="'width:' + (ventas >= 100 ? 100 : ventas) + '%'"
                ></div>
              </div>
              <p
                class="text-[9px] text-zinc-600 mt-3 font-bold uppercase italic"
              >
                Faltan <span x-text="100 - ventas"></span> ventas para el bono
                de $60.000 USD
              </p>
            </div>
            <button
              @click="modalVenta = true"
              class="w-full bg-white text-black font-black py-5 rounded-3xl text-xs uppercase tracking-[0.2em] shadow-2xl active:scale-95 transition-all"
            >
              Registrar Nueva Venta
            </button>
          </div>
          <!-- TAB: RED / EQUIPO -->
          <div x-show="tab === 'red'" class="space-y-6 animate-up">
            <div class="flex justify-between items-center">
              <h2 class="text-2xl font-black uppercase italic text-lima">
                Mi Equipo
              </h2>
              <button
                @click="modalRegistro = true"
                class="bg-zinc-800 text-[10px] font-black px-5 py-2 rounded-full uppercase border border-zinc-700 hover:bg-zinc-700 transition-colors"
              >
                + Añadir
              </button>
            </div>
            <div class="card p-5 bg-gradient-to-br from-zinc-900 to-black">
              <p
                class="text-[9px] font-bold text-zinc-500 uppercase mb-3 tracking-widest"
              >
                Tu Enlace Personal de Referido
              </p>
              <div class="flex gap-2">
                <input
                  type="text"
                  readonly
                  :value="'almaorders.com/reg?ref=' + idUsuario"
                  class="input-dark text-[10px] flex-1 text-lima font-black"
                />
                <button
                  @click="alert('Enlace copiado al portapapeles')"
                  class="bg-white text-black px-4 rounded-xl text-[10px] font-black uppercase tracking-tighter"
                >
                  Copiar
                </button>
              </div>
            </div>
            <div class="space-y-3">
              <template x-for="emb in equipo"
                ><div
                  class="card p-4 flex justify-between items-center border-l-4 border-lima"
                >
                  <div>
                    <p
                      class="text-sm font-black uppercase"
                      x-text="emb.nombre"
                    ></p>
                    <p
                      class="text-[9px] text-zinc-500 font-bold uppercase mt-1"
                      x-text="'Producción: ' + emb.ventas + ' ventas'"
                    ></p>
                  </div>
                  <p
                    class="text-lima font-black text-lg"
                    x-text="'$' + emb.pago"
                  ></p></div
              ></template>
            </div>
          </div>
          <!-- TAB: MATERIAL (MEDIA KIT) -->
          <div x-show="tab === 'material'" class="space-y-6 animate-up">
            <h2 class="text-2xl font-black uppercase italic text-lima">
              Media Kit
            </h2>
            <div class="grid grid-cols-1 gap-4">
              <template x-for="item in mediaKit">
                <div
                  class="card p-5 flex justify-between items-center group hover:border-lima/40 transition-all"
                >
                  <div class="flex items-center gap-5">
                    <div
                      class="w-12 h-12 bg-zinc-900 rounded-2xl flex items-center justify-center text-zinc-600 group-hover:text-lima transition-colors"
                    >
                      <i :class="item.icon" class="text-2xl"></i>
                    </div>
                    <div>
                      <p
                        class="text-[11px] font-black text-white uppercase"
                        x-text="item.name"
                      ></p>
                      <p
                        class="text-[9px] text-zinc-600 font-bold uppercase"
                        x-text="item.size + ' • ' + item.type"
                      ></p>
                    </div>
                  </div>
                  <button
                    @click="alert('Descargando archivo...')"
                    class="w-10 h-10 bg-lima text-black rounded-xl flex items-center justify-center shadow-lg shadow-lima/10 hover:scale-110 transition-transform"
                  >
                    <i class="fas fa-download"></i>
                  </button>
                </div>
              </template>
            </div>
          </div>
          <!-- TAB: RANGOS -->
          <div x-show="tab === 'rangos'" class="space-y-10 animate-up">
            <h2 class="text-2xl font-black uppercase italic text-lima">
              Plan de Carrera
            </h2>
            <div class="relative pl-10 border-l-2 border-zinc-800 space-y-12">
              <template x-for="rango in rangos">
                <div class="relative">
                  <div
                    class="absolute -left-[49px] top-1 w-4 h-4 rounded-full border-4 border-black z-10"
                    :class="historia >= rango.min ? 'bg-lima shadow-[0_0_15px_#bef264]' : 'bg-zinc-800'"
                  ></div>
                  <div
                    class="card p-6"
                    :class="historia >= rango.min ? 'border-lima/40 bg-zinc-900/20' : 'opacity-30'"
                  >
                    <div class="flex justify-between items-start mb-4">
                      <h4
                        class="font-black text-xs uppercase italic tracking-widest"
                        x-text="rango.nombre"
                      ></h4>
                      <span
                        x-show="historia >= rango.min"
                        class="text-[8px] font-black bg-lima text-black px-2 py-0.5 rounded uppercase"
                        >Alcanzado</span
                      >
                    </div>
                    <p
                      class="text-[10px] text-zinc-400 font-bold uppercase mb-4"
                      x-text="'Recompensa: ' + rango.premio"
                    ></p>
                    <template x-if="historia >= rango.min && !rango.reclamado">
                      <button
                        @click="rango.reclamado = true; alert('¡Solicitud enviada! Recibirás noticias pronto.')"
                        class="w-full bg-white text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-widest shadow-lg"
                      >
                        Reclamar Premio
                      </button>
                    </template>
                    <template x-if="rango.reclamado">
                      <p
                        class="text-center text-[10px] text-lima font-black uppercase italic tracking-widest"
                      >
                        ✓ En proceso de entrega
                      </p>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <!-- TAB: SOPORTE (CHAT) -->
          <div
            x-show="tab === 'soporte'"
            class="flex flex-col h-[70vh] animate-up"
          >
            <h2 class="text-2xl font-black uppercase italic text-lima mb-6">
              Soporte Chat
            </h2>
            <div class="flex-1 overflow-y-auto space-y-4 p-2 no-scrollbar">
              <div class="flex justify-start">
                <div
                  class="bg-zinc-800 p-4 rounded-2xl rounded-bl-none text-[11px] font-medium max-w-[85%] border border-zinc-700 leading-relaxed italic text-zinc-300"
                >
                  ¡Hola, Embajador! 👋 Bienvenido al soporte técnico de Alma
                  Orders. ¿En qué podemos apoyarte hoy?
                </div>
              </div>
              <template x-for="msg in chat"
                ><div class="flex justify-end">
                  <div
                    class="bg-lima text-black p-4 rounded-2xl rounded-br-none text-[11px] font-black max-w-[85%] shadow-lg shadow-lima/10"
                    x-text="msg"
                  ></div></div
              ></template>
            </div>
            <div class="mt-6 flex gap-3">
              <input
                type="text"
                x-model="nuevoMsg"
                @keyup.enter="enviarMsg()"
                placeholder="Escribe un mensaje..."
                class="input-dark flex-1 text-[11px] font-bold"
              />
              <button
                @click="enviarMsg()"
                class="bg-lima text-black w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-lima/20 active:scale-90 transition-all"
              >
                <i class="fas fa-paper-plane text-lg"></i>
              </button>
            </div>
          </div>
          <!-- TAB: PERFIL -->
          <div
            x-show="tab === 'perfil'"
            class="space-y-8 pt-10 text-center animate-up"
          >
            <div class="relative w-32 h-32 mx-auto">
              <img
                :src="profilePhoto"
                class="w-full h-full rounded-full border-4 border-lima p-1 shadow-2xl object-cover"
              />
              <label
                class="absolute bottom-0 right-0 bg-white text-black w-10 h-10 rounded-full flex items-center justify-center cursor-pointer shadow-xl hover:scale-110 transition-transform"
              >
                <i class="fas fa-camera text-sm"></i>
                <input
                  type="file"
                  @change="uploadPhoto"
                  class="hidden"
                  accept="image/*"
                />
              </label>
            </div>
            <div>
              <h2
                class="text-3xl font-black uppercase tracking-tighter italic"
                x-text="nombreUsuario"
              ></h2>
              <p
                class="text-lima font-black text-[10px] mt-2 uppercase tracking-[0.4em] mb-8"
                x-text="'ID: ' + idUsuario"
              ></p>
            </div>
            <div class="space-y-3 text-left">
              <div class="card p-5 flex justify-between items-center">
                <span
                  class="text-[10px] text-zinc-600 font-bold uppercase italic tracking-widest"
                  >País</span
                ><span class="text-[11px] font-black uppercase text-white"
                  >Argentina</span
                >
              </div>
              <div class="card p-5 flex justify-between items-center">
                <span
                  class="text-[10px] text-zinc-600 font-bold uppercase italic tracking-widest"
                  >Estado KYC</span
                ><span
                  class="text-lima font-black text-[10px] uppercase tracking-widest"
                  >✓ Verificado</span
                >
              </div>
            </div>
            <button
              @click="location.reload()"
              class="w-full bg-red-950/20 text-red-500 font-black py-5 rounded-3xl border border-red-900/30 text-[11px] uppercase tracking-[0.3em] mt-10 hover:bg-red-900/40 transition-colors"
            >
              Cerrar Sesión
            </button>
          </div>
        </main>
        <!-- NAVEGACIÓN INFERIOR MAESTRA -->
        <nav
          class="fixed bottom-0 left-0 w-full p-6 bg-black/95 border-t border-zinc-900 flex justify-around items-center z-[200] backdrop-blur-xl"
        >
          <button
            @click="tab = 'inicio'"
            :class="tab === 'inicio' ? 'text-lima scale-125' : 'text-zinc-700'"
            class="flex flex-col items-center transition-all duration-300"
          >
            <i class="fas fa-home text-2xl"></i>
          </button>
          <button
            @click="tab = 'red'"
            :class="tab === 'red' ? 'text-lima scale-125' : 'text-zinc-700'"
            class="flex flex-col items-center transition-all duration-300"
          >
            <i class="fas fa-users text-2xl"></i>
          </button>
          <button
            @click="tab = 'material'"
            :class="tab === 'material' ? 'text-lima scale-125' : 'text-zinc-600'"
            class="flex flex-col items-center transition-all duration-300"
          >
            <i class="fas fa-images text-2xl"></i>
          </button>
          <button
            @click="tab = 'rangos'"
            :class="tab === 'rangos' ? 'text-lima scale-125' : 'text-zinc-600'"
            class="flex flex-col items-center transition-all duration-300"
          >
            <i class="fas fa-medal text-2xl"></i>
          </button>
          <button
            @click="tab = 'soporte'"
            :class="tab === 'soporte' ? 'text-lima scale-125' : 'text-zinc-700'"
            class="flex flex-col items-center transition-all duration-300"
          >
            <i class="fas fa-headset text-2xl"></i>
          </button>
        </nav>
      </div>
    </template>
    <!-- MODALES DE ACCIÓN -->
    <div
      x-show="modalVenta || modalRegistro"
      x-cloak
      class="fixed inset-0 z-[300] flex items-end"
    >
      <div
        class="absolute inset-0 bg-black/95 backdrop-blur-md"
        @click="modalVenta = false; modalRegistro = false"
      ></div>
      <!-- Modal Registrar Venta -->
      <div
        x-show="modalVenta"
        class="bg-[#111] w-full rounded-t-[40px] p-10 border-t-2 border-lima z-[310] animate-up shadow-2xl"
      >
        <h2
          class="text-2xl font-black mb-8 uppercase italic text-center text-white tracking-tighter underline decoration-lima underline-offset-8"
        >
          Venta Directa
        </h2>
        <div class="space-y-4">
          <button
            @click="addSale(35000)"
            class="w-full bg-lima text-black font-black py-5 rounded-2xl text-[11px] uppercase tracking-widest shadow-xl active:scale-95 transition-all"
          >
            Elite Plan ($35,000)
          </button>
          <button
            @click="addSale(25000)"
            class="w-full bg-zinc-800 text-white font-black py-5 rounded-2xl text-[11px] uppercase tracking-widest shadow-xl active:scale-95 transition-all"
          >
            Advanced Plan ($25,000)
          </button>
        </div>
      </div>
      <!-- Modal Nuevo Referido -->
      <div
        x-show="modalRegistro"
        class="bg-[#111] w-full rounded-t-[40px] p-10 border-t-2 border-lima z-[310] animate-up shadow-2xl"
      >
        <h2
          class="text-2xl font-black mb-6 uppercase italic text-center text-white tracking-tighter"
        >
          Registrar Nuevo Embajador
        </h2>
        <div class="space-y-5">
          <input
            type="text"
            x-model="nuevoEmbajador.nombre"
            placeholder="Nombre Completo"
            class="input-dark"
          />
          <input
            type="email"
            x-model="nuevoEmbajador.email"
            placeholder="Correo Electrónico"
            class="input-dark"
          />
          <button
            @click="registerReferral()"
            class="w-full bg-lima text-black font-black py-5 rounded-2xl text-[11px] uppercase tracking-widest shadow-xl active:scale-95 transition-all"
          >
            Finalizar Registro de Red
          </button>
        </div>
      </div>
    </div>
    <script>
      function appData() {
        return {
          view: "auth",
          tab: "inicio",
          inputCodigo: "",
          aceptaLegal: false,
          ventas: 0,
          comision: 0,
          historia: 0,
          idUsuario: "ALMA-7724",
          nombreUsuario: "Socio Fundador",
          profilePhoto: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
          modalVenta: false,
          modalRegistro: false,
          nuevoMsg: "",
          chat: [],
          nuevoEmbajador: { nombre: "", email: "" },
          equipo: [
            { id: 1, nombre: "Juan Pérez", ventas: 12, pago: 4800 },
            { id: 2, nombre: "Maria García", ventas: 8, pago: 3200 },
          ],
          mediaKit: [
            {
              name: "Banners Redes Sociales",
              size: "2.4 MB",
              type: "JPG",
              icon: "fas fa-image",
            },
            {
              name: "Video Corporativo AO",
              size: "15.8 MB",
              type: "MP4",
              icon: "fas fa-video",
            },
            {
              name: "Pack de Logos Oficiales",
              size: "5.0 MB",
              type: "ZIP",
              icon: "fas fa-file-archive",
            },
            {
              name: "Brochure Informativo",
              size: "1.2 MB",
              type: "PDF",
              icon: "fas fa-file-pdf",
            },
          ],
          rangos: [
            {
              id: 1,
              nombre: "Bronce",
              min: 0,
              premio: "Kit Digital AO",
              reclamado: false,
            },
            {
              id: 2,
              nombre: "Plata",
              min: 100000,
              premio: "Tablet de Trabajo",
              reclamado: false,
            },
            {
              id: 3,
              nombre: "Oro",
              min: 500000,
              premio: "Bono Especial $500 USD",
              reclamado: false,
            },
            {
              id: 4,
              nombre: "Platino",
              min: 1000000,
              premio: "Viaje Convención Anual",
              reclamado: false,
            },
          ],
          login() {
            if (this.inputCodigo.toUpperCase() === "ALMA2024")
              this.view = "legal";
            else alert("Código inválido. Usa: ALMA2024");
          },
          addSale(monto) {
            this.ventas++;
            this.comision += monto * 0.4;
            this.historia += monto;
            this.modalVenta = false;
          },
          registerReferral() {
            if (this.nuevoEmbajador.nombre) {
              this.equipo.unshift({
                id: Date.now(),
                nombre: this.nuevoEmbajador.nombre,
                ventas: 0,
                pago: 0,
              });
              this.nuevoEmbajador = { nombre: "", email: "" };
              this.modalRegistro = false;
              alert("¡Embajador registrado en tu red!");
            }
          },
          enviarMsg() {
            if (this.nuevoMsg) {
              this.chat.push(this.nuevoMsg);
              this.nuevoMsg = "";
              setTimeout(() => {
                alert("Soporte recibió tu mensaje.");
              }, 1000);
            }
          },
          uploadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (e) => {
                this.profilePhoto = e.target.result;
              };
              reader.readAsDataURL(file);
            }
          },
        };
      }
    </script>
  </body>
</html>
